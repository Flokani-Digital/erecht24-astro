name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / Astro ${{ matrix.astro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 24.21.0, astro: 7.3.5, adapter: 11.1.6, cloudflare: 14.3.4, wrangler: 4.125.0, vite: 8.0.13 }
          - { node: 22.12.0, astro: 7.0.0, adapter: 11.0.0, cloudflare: 14.0.0, wrangler: 4.83.0, vite: 8.0.13 }
    env:
      RECHTSTEXTE_TEST_ASTRO_VERSION: ${{ matrix.astro }}
      RECHTSTEXTE_TEST_ADAPTER_VERSION: ${{ matrix.adapter }}
      RECHTSTEXTE_TEST_CLOUDFLARE_VERSION: ${{ matrix.cloudflare }}
      RECHTSTEXTE_TEST_WRANGLER_VERSION: ${{ matrix.wrangler }}
      RECHTSTEXTE_TEST_VITE_VERSION: ${{ matrix.vite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
